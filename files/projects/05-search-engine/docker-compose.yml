version: "3.9"

# Single-node GoSearch.
# For a sharded cluster add more gosearch services and put a load-balancer in front.

services:

  gosearch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gosearch
    command: ["-addr", ":8080"]
    ports:
      - "8080:8080"
    environment:
      - SERVER_ADDR=:8080
      - INDEX_DATA_DIR=/data
      - INDEX_MAX_CACHE=10000
      - INDEX_ANALYZER=english
      - LOG_LEVEL=info
    volumes:
      - gosearch-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  gosearch-data:
