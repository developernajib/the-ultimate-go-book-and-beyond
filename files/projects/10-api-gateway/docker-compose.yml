version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - gateway_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: gateway-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "6831:6831/udp" # Jaeger agent (Thrift UDP)
      - "14268:14268"   # Jaeger collector HTTP
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Example upstream service (echo server for testing)
  echo:
    image: ealen/echo-server:latest
    container_name: gateway-echo
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      PORT: 80

volumes:
  gateway_redis_data:
